name: Continuous Integration

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    # Skip if it's a PR from the same repo (already ran on push)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Retry setup-sbt once (macOS)
        if: runner.os == 'macOS' && steps.setup_sbt.outcome == 'failure'
        uses: sbt/setup-sbt@v1
        continue-on-error: true

      - name: Fallback install sbt (macOS)
        if: runner.os == 'macOS' && failure()
        run: brew install sbt

      - name: Run tests
        run: sbt test
        shell: bash
  verify:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Build the plugin
        run: sbt test packageArtifact
        shell: bash

      - name: Verify Plugin on IntelliJ Platforms
        id: verify
        uses: ChrisCarini/intellij-platform-plugin-verifier-action@latest
        with:
          plugin-location: 'target/plugin/kebs-intellij/lib/kebs-intellij.jar'
          verifier-version: '1.384'
          ide-versions: |
            ideaIC:2025.2
            ideaIC:2025.3
            ideaIC:2026.1
          failure-levels: |
            COMPATIBILITY_PROBLEMS
            INVALID_PLUGIN
